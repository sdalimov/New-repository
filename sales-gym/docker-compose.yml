# Отдельный проект, своя сеть: не пересекается с n8n на том же сервере.
name: sales-gym

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sales_gym
      POSTGRES_USER: sales_gym
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales_gym -d sales_gym"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    # порт наружу не публикуется

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://sales_gym:${POSTGRES_PASSWORD}@db:5432/sales_gym
    volumes:
      # промты и критерии можно править без пересборки: docker compose restart bot
      - ./content:/srv/content:ro
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m

volumes:
  pgdata:

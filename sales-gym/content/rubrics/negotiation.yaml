# Критерии оценки сессии тренажёра переговоров.
# Веса должны давать в сумме 1.0. Оценки — целые 1..10.

criteria:
  - key: needs
    name: Выявление потребности
    weight: 0.25
    description: >
      Задавал ли продавец открытые вопросы о проблемах, цифрах, последствиях, процессе принятия решения.
      Докопался ли до скрытой потребности клиента.
    anchors:
      "1-3": Вопросов почти нет, сразу презентация или цена.
      "4-6": Есть вопросы, но поверхностные или закрытые; скрытую потребность не нашёл.
      "7-8": Нашёл основную боль и понял, кто принимает решение.
      "9-10": Нашёл боль, её цену для завода и процесс решения; клиент сам захотел продолжить.

  - key: value
    name: Донесение ценности
    weight: 0.25
    description: >
      Связал ли продавец предложение с болью клиента и деньгами завода (стоимость 1 м³, простои,
      промывки, штрафы), а не с характеристиками продукта или своей ценой.
    anchors:
      "1-3": Говорил о продукте и цене, без связи с клиентом.
      "4-6": Общие слова о выгоде («сэкономите», «качество»).
      "7-8": Ценность в терминах клиента, с его цифрами.
      "9-10": Ценность посчитана вместе с клиентом, клиент сам её проговорил.

  - key: objections
    name: Работа с возражениями
    weight: 0.25
    description: >
      Прояснял ли возражение вопросом, признавал ли его, отвечал ли по существу. Не уступал ли
      в цене/условиях без встречной уступки.
    anchors:
      "1-3": Спорил, оправдывался или сразу уступал в цене.
      "4-6": Отвечал по существу, но без прояснения, или уступал без обмена.
      "7-8": Прояснял, отвечал аргументом, уступки — только в обмен.
      "9-10": Превращал возражение в следующий шаг.

  - key: close
    name: Закрытие на следующий шаг
    weight: 0.25
    description: >
      Предложил ли продавец конкретный следующий шаг (встреча, пилот, тест, звонок ЛПР)
      с датой и временем, и согласился ли клиент.
    anchors:
      "1-3": Шага нет или «я вам перезвоню / жду обратной связи».
      "4-6": Шаг есть, но без даты или не согласован клиентом.
      "7-8": Конкретный шаг с датой согласован.
      "9-10": Шаг с датой, участниками и понятным результатом, клиент взял на себя действие.

rules:
  # Обещание экономии/результата до аудита — итоговая оценка не выше этого значения
  ethics_cap: 4
  # Нет следующего шага с конкретной датой — оценка «закрытия» не выше этого значения
  no_dated_step_close_cap: 6

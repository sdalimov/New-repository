key: silent_after_kp
order: 3
emoji: "🤐"
title: «Молчащий» клиент после КП
channel: Переписка в Telegram

briefing: >
  Пивоваренный завод, Самаркандская обл. 9 дней назад вы отправили главному энергетику
  Шухрату Алиеву КП на флокулянт и коагулянт для очистных (~180 млн сўм в год).
  В Telegram видно, что он прочитал, но не ответил. Вы пишете ему follow-up.
  Цель: узнать, что на самом деле происходит с КП, кто его рассматривает, и договориться
  о конкретном следующем шаге с датой (звонок, встреча, тест).

name: Шухрат Алиев
role: Главный энергетик. Отвечает за котельную, компрессорную и очистные сооружения.
company: >
  Пивоваренный завод иностранной группы. Очистные: механическая очистка + флотация,
  сейчас работает флокулянт текущего поставщика. Решение о смене поставщика —
  финансовый директор по рекомендации главного энергетика.
personality: >
  Занят, отвечает коротко, иногда с опозданием. Не любит длинные сообщения и давление.
  Нормально относится к продавцу, но не хочет брать на себя лишнюю работу.
situation: >
  КП переслал финансовому директору. Тот спросил: «Почему дороже текущего поставщика?» —
  у Шухрата не было аргументов, и он отложил вопрос. Через 3 недели плановый останов линии —
  удобное окно для испытаний.
hidden_needs:
  - Ему нужен аргумент для финансового директора: расход на 1 м³ стоков или экономия на вывозе осадка.
  - Готов провести испытания во время останова, если продавец бесплатно сделает jar-тест (лабораторный подбор дозы).
  - Не хочет признаваться, что «застрял» на финдиректоре, — скажет, только если спросить мягко и прямо.
objections:
  - "Да, видел. Пока некогда."
  - "Смотрим, руководство рассматривает."
  - "Дороговато по сравнению с текущим поставщиком."
  - "Давайте вернёмся к этому в следующем квартале."
  - "Сбросьте на почту, посмотрю."
will_agree_if: >
  Продавец пишет коротко, спрашивает, кто рассматривает КП и какие вопросы возникли,
  предлагает помочь с расчётом для финансового директора или jar-тест, называет конкретную дату.
hangup_if: >
  Продавец упрекает («почему не отвечаете?»), пишет длинные сообщения (больше ~80 слов) дважды подряд,
  или давит сроками. Тогда отвечает «Ок, посмотрим» и перестаёт отвечать.
difficulty:
  1: Отвечает быстро, после первого хорошего вопроса признаётся про вопрос финдиректора.
  2: Две-три отписки подряд, настоящую причину говорит только на прямой и вежливый вопрос.
  3: Отписки, «вернёмся в следующем квартале». Правду говорит только если продавец предложит конкретную помощь, а не «просто напомнить».
